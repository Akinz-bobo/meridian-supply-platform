name: Infrastructure

# Plans every infrastructure change on a pull request and applies it on
# merge. See docs/guides/pipeline.md.

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/**'
      - 'Makefile'
      - 'compose.yaml'
      - '.terraform-version'
      - '.github/workflows/infrastructure.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/**'
      - 'Makefile'
      - 'compose.yaml'
      - '.terraform-version'
      - '.github/workflows/infrastructure.yml'
      - '.github/actions/**'

concurrency:
  # One run at a time per branch. A run on main is never cancelled halfway
  # through an apply.
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Promotion order. The apply on merge goes through them one at a time.
  ENVIRONMENTS: dev staging production
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

jobs:
  # One job per environment, in parallel, each with an emulator of its own.
  # The time a pull request waits is that of the slowest environment, not
  # the sum of all three.
  rehearse:
    name: Rehearse ${{ matrix.environment }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One environment failing says nothing about the others. Let them
      # finish, so the plan comment is complete.
      fail-fast: false
      matrix:
        environment: [dev, staging, production]
    env:
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-terraform
        with:
          tools: conftest

      - name: Start the emulator
        run: make up

      - name: Create the state bucket
        run: make bootstrap

      # The emulator starts empty, so a plan on its own would always say
      # "create everything". Applying the base branch first makes the plan
      # that follows a true difference, including anything deleted.
      - name: Apply the base branch
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          # apply-all, and not a loop over layers, so that the base branch's
          # own steps between layers run: its images are pushed before its
          # services are deployed.
          make -C "$RUNNER_TEMP/base" apply-all ENV="$ENVIRONMENT"

      - name: Plan the pull request and check policies
        id: report
        run: |
          status=0
          make report ENVS="$ENVIRONMENT" || status=$?
          cat plan-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Collected by the comment job, which joins the three into one.
      - name: Keep the plan report
        if: always() && steps.report.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: plan-report-${{ matrix.environment }}
          path: plan-report.md
          retention-days: 7

      - name: Fail if a plan failed or violated a policy
        if: steps.report.outputs.status != '0'
        run: |
          echo "::error::A plan for $ENVIRONMENT failed or violated a policy. See the plan comment on the pull request."
          exit 1

      - name: Rehearse the apply
        run: |
          echo "::group::apply $ENVIRONMENT"
          make apply-all ENV="$ENVIRONMENT"
          echo "::endgroup::"
          make smoke ENV="$ENVIRONMENT"
          make state-audit ENV="$ENVIRONMENT"
          make data-check ENV="$ENVIRONMENT"
          make event-check ENV="$ENVIRONMENT"
          make compute-check ENV="$ENVIRONMENT"

      - name: Rehearse the teardown
        run: make teardown ENV="$ENVIRONMENT"

      - name: Show emulator logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the emulator
        if: always()
        run: make down

  # Module apply tests use an account of their own and no environment, so
  # they run once and not once per environment.
  module-apply-tests:
    name: Module apply tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-terraform

      - name: Start the emulator
        run: make up

      - name: Run module apply tests
        run: make test-emulator

      - name: Show emulator logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the emulator
        if: always()
        run: make down

  # Joins the three plan reports into the single comment on the pull request.
  comment:
    name: Plan comment
    if: always() && github.event_name == 'pull_request'
    needs: rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: plan-report-*
          path: reports

      - name: Join the reports
        run: |
          files=()
          for environment in $ENVIRONMENTS; do
            files+=("reports/plan-report-$environment/plan-report.md")
          done
          ./scripts/plan-report-merge.sh plan-report.md "${files[@]}"
          cat plan-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the plan on the pull request
        # A pull request from a fork gets a read-only token and cannot comment.
        continue-on-error: true
        run: ./scripts/pr-comment.sh "${{ github.event.pull_request.number }}" plan-report.md
        env:
          GH_TOKEN: ${{ github.token }}

  # On merge the environments are applied one after another, on purpose. It
  # is a promotion: each must pass before the next begins.
  apply:
    name: Apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-terraform

      - name: Start the emulator
        run: make up

      - name: Create the state bucket
        run: make bootstrap

      - name: Apply and verify each environment
        run: |
          {
            echo '## Applied'
            echo
            echo '| Environment | Result |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for environment in $ENVIRONMENTS; do
            echo "::group::apply $environment"
            make apply-all ENV="$environment"
            echo "::endgroup::"
            make smoke ENV="$environment"
            make state-audit ENV="$environment"
            make data-check ENV="$environment"
            make event-check ENV="$environment"
            make compute-check ENV="$environment"
            echo "| \`$environment\` | applied, smoke test, data, event and compute checks passed, no secrets in state |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Show emulator logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the emulator
        if: always()
        run: make down
