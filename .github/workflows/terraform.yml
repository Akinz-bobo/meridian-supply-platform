name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/**'
      - 'Makefile'
      - '.terraform-version'
      - '.tflint.hcl'
      - 'trivy.yaml'
      - '.trivyignore.yaml'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/**'
      - 'Makefile'
      - '.terraform-version'
      - '.tflint.hcl'
      - 'trivy.yaml'
      - '.trivyignore.yaml'
      - '.github/workflows/terraform.yml'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Format, validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Terraform version
        id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false
      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ hashFiles('infra/**/.terraform.lock.hcl') }}
      - name: Use the provider cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - name: Format and validate
        run: make validate
      - name: Module tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned tools
        run: |
          BIN_DIR="$HOME/.local/bin" ./scripts/install-tools.sh tflint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache tflint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - name: tflint
        run: make lint
        env:
          # Raises the rate limit when tflint downloads its ruleset.
          GITHUB_TOKEN: ${{ github.token }}

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned tools
        run: |
          BIN_DIR="$HOME/.local/bin" ./scripts/install-tools.sh trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache the scanner's checks
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-checks-${{ github.run_id }}
          restore-keys: trivy-checks-
      - name: trivy
        run: make scan

  policy:
    name: Policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned tools
        run: |
          BIN_DIR="$HOME/.local/bin" ./scripts/install-tools.sh conftest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test the policies
        run: make policy-test
