name: Bug
description: Something does not behave as documented
labels: ['type: bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, inputs and the environment (dev, staging, emulator version).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or output
      render: text
