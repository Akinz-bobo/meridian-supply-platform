# Local AWS emulator. See docs/guides/local-development.md.
#
# The version is pinned on purpose: an emulator upgrade can change behaviour,
# so it goes through a pull request like any other change.
name: meridian

services:
  floci:
    image: floci/floci:2.4.0
    container_name: meridian-floci
    ports:
      - '127.0.0.1:${FLOCI_PORT:-4566}:4566'
      # The data plane of emulated load balancers: every HTTPS listener on
      # 443 is served here. Published on a high port so nothing needs root.
      - '127.0.0.1:${FLOCI_HTTPS_PORT:-8443}:443'
    volumes:
      # Lets the emulator start real containers for RDS, ECS, EKS, EC2 and Lambda.
      - /var/run/docker.sock:/var/run/docker.sock
    # No healthcheck here: the image defines its own, and it has no curl or wget
    # to build another one from.
    restart: unless-stopped
