# Findings that are deliberately not fixed.
#
# Each entry needs: the rule id, the paths it applies to, and a statement of
# why the finding does not apply or why the risk is accepted. An entry with
# no reason is not accepted in review.

misconfigurations:
  - id: AVD-AWS-0104
    paths:
      - 'modules/tier-security-groups/main.tf'
    statement: >-
      Accepted. Workloads may open HTTPS (TCP 443 only) to any address,
      because they call AWS APIs and partner APIs whose addresses are not
      fixed. No other port is open outbound, the data tier has no egress at
      all, and the destination is reviewed in the network and security
      baseline review. Filtering by domain name would need an egress proxy
      or a network firewall, which is recorded there as a possible hardening.
  - id: AVD-AWS-0345
    paths:
      - 'modules/access-roles/main.tf'
    statement: >-
      Accepted. The deploy role runs Terraform, which manages every resource
      type the platform uses, S3 included. The role is limited to one region,
      cannot create a role without the workload boundary and cannot change
      its own permissions. The same exception is recorded for the policy
      check POL-IAM-2 in infra/policies/data/exceptions.yaml.
